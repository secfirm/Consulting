<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --navy:        #0D1B2A;
  --teal:        #14B8A6;
  --paper:       #F2F4F7;
  --navy-900:    #050B14;
  --navy-800:    #0A1320;
  --navy-700:    #0D1B2A;
  --navy-600:    #11253A;
  --navy-500:    #18324C;
  --teal-700:    #0E8C7E;
  --teal-600:    #119A8A;
  --teal-500:    #14B8A6;
  --teal-400:    #2DD4BF;
  --teal-glow:   rgba(20,184,166,0.28);
  --white:       #FFFFFF;
  --paper-50:    #F8FAFC;
  --paper-100:   #F2F4F7;
  --paper-200:   #E4E9F0;
  --ink-900:     #0D1B2A;
  --ink-600:     #475569;
  --ink-400:     #64748B;
  --fg-1:        #F4F7FA;
  --fg-2:        #9DB2C7;
  --fg-3:        #5E7791;
  --slate:       #8BA7BF;
  --card-dark:        rgba(17,37,58,0.55);
  --card-dark-border: rgba(20,184,166,0.14);
  --glass:            rgba(13,27,42,0.72);
  --font-display: 'Manrope', system-ui, sans-serif;
  --font-body:    'Inter', system-ui, sans-serif;
  --r-sm:  8px;
  --r-md:  12px;
  --r-lg:  16px;
  --r-xl:  22px;
  --r-pill: 999px;
  --shadow-sm:   0 4px 14px rgba(5,11,20,0.06);
  --shadow-md:   0 12px 30px rgba(5,11,20,0.10);
  --shadow-lg:   0 24px 60px rgba(5,11,20,0.18);
  --shadow-teal: 0 10px 30px rgba(20,184,166,0.28);
  --ease-out: cubic-bezier(0.16,1,0.3,1);
  --dur: 0.4s;
}

/* ============================================================
   RESET + BASE
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-body);
  background:var(--navy-900);
  color:var(--fg-1);
  font-size:16px;
  line-height:1.7;
  overflow-x:hidden;
}
a{text-decoration:none;color:inherit;}
img{display:block;max-width:100%;}
.container{max-width:1180px;margin:0 auto;padding:0 28px;position:relative;z-index:2;}

/* cursor spotlight */
.spotlight{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(560px circle at var(--mx,50%) var(--my,30%),rgba(20,184,166,0.06),transparent 75%);
}

/* ============================================================
   CUSTOM CURSOR
   ============================================================ */
@media(pointer:fine){body.has-cursor,body.has-cursor *{cursor:none!important;}}
.cursor-dot,.cursor-ring{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;will-change:transform;}
.cursor-dot{width:8px;height:8px;border-radius:50%;background:var(--teal-400);box-shadow:0 0 10px rgba(45,212,191,.7);mix-blend-mode:screen;}
.cursor-ring{width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(45,212,191,.55);transition:width .18s ease-out,height .18s ease-out,border-color .18s ease-out,background .18s ease-out,opacity .18s ease-out;}
.cursor-ring.hot{width:46px;height:46px;border-color:rgba(45,212,191,.9);background:rgba(20,184,166,.1);box-shadow:0 0 28px rgba(20,184,166,.35);margin-top:-7px;margin-left:-7px;}
.cursor-ring.press{transform:scale(.78);opacity:.8;}

/* ============================================================
   HEAD CARET + REVEAL
   ============================================================ */
.head-caret{display:inline-block;width:3px;height:.92em;background:var(--teal-400);margin-left:4px;transform:translateY(2px);animation:blink 1s steps(1) infinite;}
.reveal{will-change:opacity,transform;}
@keyframes blink{50%{opacity:0;}}

/* ============================================================
   EYEBROW + DRAW LINE
   ============================================================ */
.eyebrow{display:inline-block;font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--teal-500);}
.eyebrow.on-dark{color:var(--teal-400);}
.draw-line{height:3px;width:0;background:linear-gradient(90deg,var(--teal-500),var(--teal-400));border-radius:2px;}
.draw-line.center{margin:0 auto;}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:15px 30px;border-radius:var(--r-sm);font-family:var(--font-display);
  font-weight:600;font-size:14.5px;letter-spacing:.03em;cursor:pointer;
  border:none;transition:transform .18s var(--ease-out),filter .18s var(--ease-out),box-shadow .18s var(--ease-out),background .18s var(--ease-out),color .18s var(--ease-out),border-color .18s var(--ease-out);
  position:relative;overflow:hidden;white-space:nowrap;
}
.btn:hover{transform:translateY(-2px);}
.btn svg{width:18px;height:18px;}
.btn-primary{background:linear-gradient(135deg,var(--teal-400),var(--teal-500));color:var(--navy-900);box-shadow:var(--shadow-teal);}
.btn-primary:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 14px 36px rgba(20,184,166,.45);}
.btn-primary::after{content:'';position:absolute;top:0;left:-120%;width:70%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg);animation:shimmer 3.6s ease-in-out infinite;}
@keyframes shimmer{0%,60%{left:-120%;}100%{left:160%;}}
.btn-pulse{position:relative;}
.btn-pulse::before{content:'';position:absolute;inset:0;border-radius:var(--r-sm);box-shadow:0 0 0 0 rgba(20,184,166,.5);animation:pulse 2.4s var(--ease-out) infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(20,184,166,.5);}70%{box-shadow:0 0 0 16px rgba(20,184,166,0);}100%{box-shadow:0 0 0 0 rgba(20,184,166,0);}}
.btn-ghost{background:transparent;border:1.5px solid rgba(20,184,166,.4);color:var(--teal-400);}
.btn-ghost:hover{border-color:var(--teal-400);background:rgba(20,184,166,.08);transform:translateY(-2px);}
.btn-soft{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.1);}
.btn-soft:hover{background:rgba(255,255,255,.1);border-color:rgba(20,184,166,.32);}

/* ============================================================
   NAV
   ============================================================ */
.nav{position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(5,11,20,.78);border-bottom:1px solid rgba(20,184,166,.09);transition:background .3s;}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:78px;}
.brand-lockup{display:flex;align-items:center;gap:12px;}
.brand-lockup .bmark{height:40px;width:auto;}
.brand-lockup .bword{display:flex;flex-direction:column;line-height:1;}
.brand-lockup .bword b{font-family:var(--font-display);font-weight:700;font-size:19px;color:#fff;letter-spacing:-.01em;}
.brand-lockup .bword i{font-family:var(--font-display);font-style:normal;font-weight:600;font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--teal-400);margin-top:4px;}
.brand-lockup.sm .bmark{height:34px;}
.brand-lockup.sm .bword b{font-size:17px;}
.nav-right{display:flex;align-items:center;gap:22px;}
.nav-cta{padding:10px 18px;font-size:13px;gap:7px;}
.nav-cta svg{width:16px;height:16px;}
.nav-links{display:flex;align-items:center;gap:30px;}
.nav-links a{font-family:var(--font-display);font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--slate);position:relative;padding:6px 0;transition:color .3s;}
.nav-links a::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--teal-400);transition:width .3s var(--ease-out);}
.nav-links a:hover{color:var(--teal-400);}
.nav-links a:hover::after{width:100%;}
.lang.es .nav-burger{display:none;}
.nav-mobile{display:none;}

/* ============================================================
   HERO
   ============================================================ */
.hero{position:relative;min-height:92vh;display:flex;align-items:center;overflow:hidden;padding:90px 0 70px;}
.hero-bg{position:absolute;inset:0;z-index:0;}
.hero-canvas{position:absolute;inset:0;width:100%;height:100%;}
.hero-glow{position:absolute;inset:0;background:radial-gradient(680px circle at 82% 18%,rgba(20,184,166,.16),transparent 60%),radial-gradient(560px circle at 8% 88%,rgba(20,184,166,.08),transparent 60%);animation:drift 16s ease-in-out infinite alternate;}
.hero-breathe{position:absolute;inset:-10%;background:radial-gradient(900px circle at 50% 50%,rgba(15,138,126,.22),transparent 60%),linear-gradient(135deg,#050B14,#0A2540 45%,#0E3B40 70%,#050B14);filter:blur(40px);animation:breathe 9s ease-in-out infinite alternate;opacity:.9;}
@keyframes breathe{0%{transform:scale(1) translate(0,0);filter:blur(38px) hue-rotate(0deg);}50%{transform:scale(1.06) translate(-1.2%,.8%);filter:blur(48px) hue-rotate(-6deg);}100%{transform:scale(1.03) translate(1%,-1%);filter:blur(42px) hue-rotate(4deg);}}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1);}100%{transform:translate3d(-2%,1.5%,0) scale(1.06);}}
.hero-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(20,184,166,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(20,184,166,.04) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000 30%,transparent 80%);}
.hero-inner{display:grid;grid-template-columns:1fr;max-width:940px;margin-left:auto;margin-right:auto;text-align:center;}
.hero-actions,.hero-trust{justify-content:center;}
.type-line{justify-content:center;}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(2.3rem,4.6vw,3.9rem);line-height:1.1;letter-spacing:-.025em;color:#fff;margin:22px 0 14px;}
.hero h1 .grad{background:linear-gradient(120deg,var(--teal-400),var(--teal-600));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.type-line{font-family:var(--font-display);font-weight:700;font-size:clamp(1rem,1.6vw,1.3rem);color:var(--teal-400);min-height:1.6em;margin-bottom:24px;letter-spacing:.01em;display:flex;align-items:center;}
.type-cursor{display:inline-block;width:2px;height:1.05em;background:var(--teal-400);margin-left:3px;transform:translateY(3px);animation:blink 1s steps(1) infinite;}
.hero-sub{font-size:1.12rem;color:var(--fg-2);max-width:580px;margin:0 auto 34px;}
.hero-actions{display:flex;gap:15px;flex-wrap:wrap;}
.hero-trust{display:flex;align-items:center;gap:22px;margin-top:36px;color:var(--slate);font-size:13px;flex-wrap:wrap;}
.hero-trust .dot{width:4px;height:4px;border-radius:50%;background:var(--teal-500);}

/* ROI calc card */
@keyframes bonusIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
/* ============================================================
   SECTIONS
   ============================================================ */
section{position:relative;}
.s-dark{background:var(--navy-800);}
.s-darker{background:var(--navy-900);}
.s-light{background:var(--navy-800);color:var(--fg-1);}
.s-pad{padding:116px 0;}
.s-head{margin-bottom:60px;}
.s-head.center{text-align:center;}
.s-head h2{font-family:var(--font-display);font-weight:800;font-size:clamp(1.9rem,3.2vw,2.7rem);letter-spacing:-.02em;line-height:1.14;margin:14px 0 16px;}
.s-light .s-head h2{color:var(--fg-1);}
.s-dark .s-head h2,.s-darker .s-head h2{color:#fff;}
.s-head p{max-width:580px;font-size:1.06rem;}
.s-head.center p{margin:0 auto;}
.s-light .s-head p{color:var(--fg-2);}
.s-dark .s-head p,.s-darker .s-head p{color:var(--fg-2);}

/* PROOF */
.proof-rail{display:flex;align-items:center;justify-content:center;gap:38px;flex-wrap:wrap;padding-bottom:56px;margin-bottom:56px;border-bottom:1px solid var(--paper-200);}
.proof-rail .t{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-400);}
.tool{font-family:var(--font-display);font-weight:700;font-size:1.05rem;color:#9aa7b5;letter-spacing:-.01em;transition:color .3s,transform .3s;cursor:default;}
.tool:hover{color:var(--teal-700);transform:translateY(-2px);}
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;}
.quote{background:#fff;border:1px solid var(--paper-200);border-radius:var(--r-md);padding:32px 30px;box-shadow:var(--shadow-sm);transition:transform .35s var(--ease-out),box-shadow .35s var(--ease-out);}
.quote:hover{transform:translateY(-5px);box-shadow:var(--shadow-md);}
.quote .stars{color:var(--teal-500);display:flex;gap:3px;margin-bottom:14px;}
.quote .stars svg{width:16px;height:16px;fill:var(--teal-500);stroke:none;}
.quote p{font-size:.98rem;color:#334155;line-height:1.65;margin-bottom:22px;}
.quote .who{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--navy);}
.quote .role{font-size:12px;color:var(--ink-400);margin-top:2px;}

/* HOW WE WORK */
.work-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;position:relative;}
.work-steps::before{content:'';position:absolute;top:30px;left:16%;right:16%;height:2px;background:linear-gradient(90deg,transparent,rgba(20,184,166,.4),transparent);}
.work-step{position:relative;text-align:center;padding:0 12px;}
.work-num{width:60px;height:60px;margin:0 auto 22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:1.3rem;color:var(--teal-400);background:var(--navy-700);border:1.5px solid var(--teal-500);box-shadow:0 0 0 6px var(--navy-800),0 8px 22px rgba(20,184,166,.18);}
.work-step h3{font-family:var(--font-display);font-weight:700;font-size:1.15rem;color:#fff;margin-bottom:10px;}
.work-step p{font-size:.96rem;color:var(--fg-2);max-width:280px;margin:0 auto;}

/* SERVICES FLIP CARDS */
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
.flip{perspective:1400px;height:256px;}
.flip-in{position:relative;width:100%;height:100%;transition:transform .45s var(--ease-out);transform-style:preserve-3d;}
.flip:hover .flip-in{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-md);padding:30px;display:flex;flex-direction:column;will-change:transform;}
.face-front{background:linear-gradient(160deg,#ffffff 0%,#f9fbfd 100%);border:1px solid var(--paper-200);box-shadow:var(--shadow-sm);transition:box-shadow .18s var(--ease-out);}
.flip:hover .face-front{box-shadow:var(--shadow-lg);}
.face-front::before{content:'';position:absolute;inset:0;border-radius:var(--r-md);background:radial-gradient(220px circle at var(--gx,50%) var(--gy,50%),rgba(20,184,166,.16),transparent 65%);opacity:0;transition:opacity .25s ease-out;pointer-events:none;}
.flip:hover .face-front::before{opacity:1;}
.face-front .ico{width:48px;height:48px;border-radius:12px;background:rgba(20,184,166,.1);color:var(--teal-700);display:flex;align-items:center;justify-content:center;margin-bottom:auto;}
.face-front .ico svg{width:24px;height:24px;}
.svc-num{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-700);margin-bottom:8px;}
.face-front h3{font-family:var(--font-display);font-size:1.18rem;color:var(--navy);}
.face-front .hint{font-size:11px;color:var(--ink-400);margin-top:12px;display:flex;align-items:center;gap:6px;}
.face-front .hint svg{width:13px;height:13px;}
.face-back{background:linear-gradient(150deg,var(--navy-700),var(--navy-600));border:1px solid var(--teal-500);transform:rotateY(180deg);justify-content:center;}
.face-back h3{font-family:var(--font-display);font-size:1.05rem;color:var(--teal-400);margin-bottom:10px;}
.face-back p{font-size:.9rem;color:var(--fg-2);line-height:1.6;}
.face-back .go{margin-top:16px;font-family:var(--font-display);font-weight:600;font-size:13px;color:#fff;display:inline-flex;align-items:center;gap:7px;}
.face-back .go svg{width:15px;height:15px;transition:transform .3s;}
.flip:hover .face-back .go svg{transform:translateX(4px);}

/* STATS */
/* FOUNDER */
.founder-inner{display:grid;grid-template-columns:.9fr 1.1fr;gap:64px;align-items:center;}
.founder-photo{position:relative;}
.founder-photo .frame{border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow-lg);will-change:transform;height:460px;}
.founder-photo img{width:100%;height:100%;object-fit:cover;}
.founder-badge{position:absolute;bottom:-22px;right:-18px;background:var(--navy-700);color:#fff;border:1px solid var(--teal-500);border-radius:var(--r-md);padding:18px 22px;box-shadow:var(--shadow-lg);}
.founder-badge .n{font-family:var(--font-display);font-weight:800;font-size:1.6rem;color:var(--teal-400);line-height:1;}
.founder-badge .l{font-size:11px;color:var(--fg-2);text-transform:uppercase;letter-spacing:.08em;margin-top:5px;}
.founder-list{list-style:none;display:flex;flex-direction:column;gap:15px;margin-top:26px;}
.founder-list li{display:flex;gap:14px;align-items:flex-start;color:var(--ink-600);font-size:1rem;}
.founder-list li svg{width:20px;height:20px;color:var(--teal-700);flex:none;margin-top:3px;}

/* COMMUNITY */
.comm{position:relative;overflow:hidden;background:var(--navy-900);padding:124px 0;}
.comm-img{position:absolute;inset:0;background-size:cover;background-position:55% center;animation:kenburns 22s ease-in-out infinite alternate;filter:saturate(.85);}
@keyframes kenburns{0%{transform:scale(1.05) translate(0,0);}100%{transform:scale(1.14) translate(-1.2%,-.8%);}}
.comm-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,11,20,.95) 0%,rgba(5,11,20,.85) 38%,rgba(5,11,20,.55) 60%,rgba(5,11,20,.2) 100%),linear-gradient(0deg,rgba(5,11,20,.55),rgba(5,11,20,0) 60%);}
.comm-inner{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center;}
.comm-h{font-family:var(--font-display);font-weight:800;color:#fff;font-size:clamp(2rem,3.4vw,2.8rem);line-height:1.1;letter-spacing:-.022em;margin:16px 0 18px;}
.comm-body{color:var(--fg-2);font-size:1.08rem;max-width:520px;margin-bottom:30px;line-height:1.7;}
.comm-pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;}
.comm-pills .pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.04em;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:8px 14px;border-radius:var(--r-pill);backdrop-filter:blur(8px);}
.comm-pills .pill svg{width:14px;height:14px;color:var(--teal-400);}
.comm-quote{position:relative;background:rgba(13,27,42,.78);border:1px solid rgba(20,184,166,.22);border-radius:var(--r-lg);padding:32px 30px;backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(5,11,20,.5);}
.comm-quote::before{content:'';position:absolute;inset:0;border-radius:var(--r-lg);padding:1.5px;background:linear-gradient(135deg,var(--teal-500),transparent 60%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.comm-quote .cq-mark{color:var(--teal-400);margin-bottom:6px;opacity:.9;}
.comm-quote .cq-mark svg{width:28px;height:28px;}
.comm-quote blockquote{font-family:var(--font-display);font-weight:600;font-style:italic;color:#fff;font-size:1.18rem;line-height:1.5;letter-spacing:-.005em;margin-bottom:22px;}
.cq-by{display:flex;align-items:center;gap:14px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);}
.cq-by img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--teal-500);}
.cq-name{font-family:var(--font-display);font-weight:700;color:#fff;font-size:14px;}

/* ============================================================
   REVEAL (scroll fade-up)
   ============================================================ */
const REVEAL_DELAY = { d1:90, d2:180, d3:270, d4:360, d5:450 };
function Reveal({ children, className="", delay="", as="div", style }){
  const ref = React.useRef(null);
  React.useEffect(()=>{
    const el=ref.current;
    if(!el) return;
    let raf=0, io=null, started=false;
    const line=el.querySelector(".draw-line");
    const begin=()=>{
      if(started) return; started=true;
      el.classList.add("in");
      const dur=760, wait=REVEAL_DELAY[delay]||0;
      let t0=null;
      const tick=(now)=>{
        if(t0===null) t0=now+wait;
        const p=Math.max(0,Math.min(1,(now-t0)/dur));
        const e=1-Math.pow(1-p,3);
        el.style.opacity=e.toFixed(3);
        el.style.transform=p<1?`translateY(${((1-e)*34).toFixed(2)}px)`:"none";
        if(line) line.style.width=(e*64).toFixed(1)+"px";
        if(p<1) raf=requestAnimationFrame(tick);
      };
      raf=requestAnimationFrame(tick);
    };
    const r=el.getBoundingClientRect();
    if(r.top<window.innerHeight*0.94&&r.bottom>0){ begin(); }
    else {
      io=new IntersectionObserver((entries)=>{
        entries.forEach((en)=>{ if(en.isIntersecting){ begin(); io.unobserve(en.target); } });
      },{ threshold:0.16, rootMargin:"0px 0px -6% 0px" });
      io.observe(el);
    }
    return ()=>{ if(raf) cancelAnimationFrame(raf); if(io) io.disconnect(); };
  },[]);
  const Tag=as;
  return(
    <Tag ref={ref} className={`reveal ${delay} ${className}`}
         style={{ opacity:0, transform:"translateY(34px)", ...style }}>
      {children}
    </Tag>
  );
}

/* ============================================================
   COUNTER
   ============================================================ */
function Counter({ value, prefix="", suffix="", decimals=0, duration=1600 }){
  const ref=React.useRef(null);
  const [n,setN]=React.useState(0);
  const done=React.useRef(false);
  React.useEffect(()=>{
    const el=ref.current;
    if(!el) return;
    const io=new IntersectionObserver((entries)=>{
      entries.forEach((e)=>{
        if(e.isIntersecting&&!done.current){
          done.current=true;
          const start=performance.now();
          const tick=(now)=>{
            const p=Math.min((now-start)/duration,1);
            const eased=1-Math.pow(1-p,3);
            setN(value*eased);
            if(p<1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        }
      });
    },{ threshold:0.5 });
    io.observe(el);
    return ()=>io.disconnect();
  },[value]);
  const display=n.toLocaleString("en-US",{ minimumFractionDigits:decimals, maximumFractionDigits:decimals });
  return <span ref={ref}>{prefix}{display}{suffix}</span>;
}

/* ============================================================
   TYPEWRITER
   ============================================================ */
function Typewriter({ words, className }){
  const [txt,setTxt]=React.useState("");
  const [wi,setWi]=React.useState(0);
  const [del,setDel]=React.useState(false);
  React.useEffect(()=>{
    const word=words[wi%words.length];
    let to;
    if(!del&&txt===word){ to=setTimeout(()=>setDel(true),1500); }
    else if(del&&txt===""){ setDel(false); setWi((i)=>i+1); }
    else { to=setTimeout(()=>{ setTxt(del?word.slice(0,txt.length-1):word.slice(0,txt.length+1)); },del?38:70); }
    return ()=>clearTimeout(to);
  },[txt,del,wi,words]);
  return <div className={className}>{txt}<span className="type-cursor" /></div>;
}

/* ============================================================
   PARTICLES
   ============================================================ */
function Particles(){
  const ref=React.useRef(null);
  React.useEffect(()=>{
    const canvas=ref.current;
    const ctx=canvas.getContext("2d");
    let raf,w,h,pts=[];
    const DPR=Math.min(window.devicePixelRatio||1,2);
    const mouse={ x:-9999, y:-9999, on:false };
    const REPEL=130, LINK=132;
    function resize(){
      w=canvas.clientWidth; h=canvas.clientHeight;
      canvas.width=w*DPR; canvas.height=h*DPR;
      ctx.setTransform(DPR,0,0,DPR,0,0);
      const count=Math.min(72,Math.floor(w/20));
      pts=Array.from({ length:count },()=>({
        x:Math.random()*w, y:Math.random()*h,
        vx:(Math.random()-.5)*.26, vy:(Math.random()-.5)*.26,
        r:Math.random()*1.7+0.7
      }));
    }
    function onMove(e){ const r=canvas.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; mouse.on=true; }
    function onLeave(){ mouse.on=false; mouse.x=mouse.y=-9999; }
    function frame(){
      ctx.clearRect(0,0,w,h);
      for(let i=0;i<pts.length;i++){
        const p=pts[i];
        if(mouse.on){ const dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.hypot(dx,dy); if(d<REPEL&&d>0.01){ const f=(1-d/REPEL)*.85; p.vx+=(dx/d)*f; p.vy+=(dy/d)*f; } }
        p.x+=p.vx; p.y+=p.vy; p.vx*=.95; p.vy*=.95;

        if(p.x<0||p.x>w) p.vx*=-1; if(p.y<0||p.y>h) p.vy*=-1;
        p.x=Math.max(0,Math.min(w,p.x)); p.y=Math.max(0,Math.min(h,p.y));

          const q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy);

        }
        if(near){ const d2=Math.hypot(p.x-mouse.x,p.y-mouse.y); ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(mouse.x,mouse.y); ctx.strokeStyle=`rgba(45,212,191,${.22*(1-d2/REPEL)})`; ctx.lineWidth=1; ctx.stroke(); }

      raf=requestAnimationFrame(frame);
    }
    resize(); frame();
    window.addEventListener("resize",resize);
    window.addEventListener("mousemove",onMove);
    window.addEventListener("mouseout",onLeave);
    return ()=>{ cancelAnimationFrame(raf); window.removeEventListener("resize",resize); window.removeEventListener("mousemove",onMove); window.removeEventListener("mouseout",onLeave); };
  },[]);
  return <canvas ref={ref} className="hero-canvas" />;
}

/* ============================================================
   CUSTOM CURSOR
   ============================================================ */
function CustomCursor(){
  React.useEffect(()=>{
    if(window.matchMedia&&window.matchMedia("(pointer: coarse)").matches) return;
    const dot=document.createElement("div");
    const ring=document.createElement("div");
    dot.className="cursor-dot"; ring.className="cursor-ring";
    document.body.appendChild(dot); document.body.appendChild(ring);
    document.body.classList.add("has-cursor");
    let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my,raf2;
    const onMove=(e)=>{ mx=e.clientX; my=e.clientY; dot.style.transform=`translate(${mx-4}px,${my-4}px)`; };
    const hot=(t)=>t.closest&&t.closest('a,button,.flip,[data-cursor]');
    const onOver=(e)=>{ if(hot(e.target)) ring.classList.add("hot"); };
    const onOut=(e)=>{ if(hot(e.target)) ring.classList.remove("hot"); };
    const onDown=()=>ring.classList.add("press");
    const onUp=()=>ring.classList.remove("press");
    const loop=()=>{ rx+=(mx-rx)*.22; ry+=(my-ry)*.22; ring.style.transform=`translate(${rx-16}px,${ry-16}px)`; raf2=requestAnimationFrame(loop); };
    loop();
    window.addEventListener("mousemove",onMove); window.addEventListener("mouseover",onOver); window.addEventListener("mouseout",onOut); window.addEventListener("mousedown",onDown); window.addEventListener("mouseup",onUp);
    return ()=>{ cancelAnimationFrame(raf2); window.removeEventListener("mousemove",onMove); window.removeEventListener("mouseover",onOver); window.removeEventListener("mouseout",onOut); window.removeEventListener("mousedown",onDown); window.removeEventListener("mouseup",onUp); dot.remove(); ring.remove(); document.body.classList.remove("has-cursor"); };
  },[]);
  return null;
}

/* ============================================================
   MAGNETIC
   ============================================================ */
function Magnetic({ children, strength=14, className="", style }){
  const ref=React.useRef(null);
  React.useEffect(()=>{
    const el=ref.current;
    if(!el||(window.matchMedia&&window.matchMedia("(pointer: coarse)").matches)) return;
    let raf3=0,tx=0,ty=0,cx=0,cy=0;
    const apply=()=>{ cx+=(tx-cx)*.18; cy+=(ty-cy)*.18; el.style.transform=`translate(${cx.toFixed(2)}px,${cy.toFixed(2)}px)`; if(Math.abs(tx-cx)>.05||Math.abs(ty-cy)>.05) raf3=requestAnimationFrame(apply); else raf3=0; };
    const kick=()=>{ if(!raf3) raf3=requestAnimationFrame(apply); };
    const onMove=(e)=>{ const r=el.getBoundingClientRect(); const cxp=r.left+r.width/2,cyp=r.top+r.height/2; const dx=e.clientX-cxp,dy=e.clientY-cyp; const dist=Math.hypot(dx,dy); const R=Math.max(r.width,r.height)*1.2; if(dist>R){ tx=0; ty=0; } else { const fall=1-dist/R; tx=(dx/R)*strength*fall*2; ty=(dy/R)*strength*fall*2; } kick(); };
    window.addEventListener("mousemove",onMove);
    return ()=>{ cancelAnimationFrame(raf3); window.removeEventListener("mousemove",onMove); el.style.transform=""; };
  },[strength]);
  return <div ref={ref} className={className} style={{ willChange:"transform", display:"inline-block", ...style }}>{children}</div>;
}

/* ============================================================
   TYPE REVEAL
   ============================================================ */
function TypeReveal({ text, as="h2", className="", speed=22 }){
  const ref=React.useRef(null);
  const [shown,setShown]=React.useState("");
  const done=React.useRef(false);
  React.useEffect(()=>{
    const el=ref.current;
    if(!el) return;
    done.current=false; setShown("");
    const start=()=>{
      if(done.current) return; done.current=true;
      let i=0;
      const step=()=>{ i++; setShown(text.slice(0,i)); if(i<text.length) setTimeout(step,speed); };
      step();
    };
    const r=el.getBoundingClientRect();
    if(r.top<innerHeight*1.2&&r.bottom>-200){ start(); return; }
    const io=new IntersectionObserver((es)=>{ es.forEach((e)=>{ if(e.isIntersecting){ start(); io.unobserve(e.target); } }); },{ threshold:0.3 });
    io.observe(el);
    const fallback=setTimeout(start,2200);
    return ()=>{ io.disconnect(); clearTimeout(fallback); };
  },[text,speed]);
  const Tag=as;
  const inProgress=shown.length<text.length;
  return(
    <Tag ref={ref} className={className} style={{ minHeight:"1.14em" }}>
      {shown}{inProgress&&<span className="head-caret" />}
    </Tag>
  );
}

/* ============================================================
   useTilt
   ============================================================ */
function useTilt(max=9){
  const ref=React.useRef(null);
  React.useEffect(()=>{
    const el=ref.current;
    if(!el||(window.matchMedia&&window.matchMedia("(pointer: coarse)").matches)) return;
    let raf4=0,tx=0,ty=0,cx=0,cy=0,lift=0,lt=0;
    const apply=()=>{ cx+=(tx-cx)*.18; cy+=(ty-cy)*.18; lt+=(lift-lt)*.18; el.style.transform=`perspective(900px) rotateX(${cy.toFixed(2)}deg) rotateY(${cx.toFixed(2)}deg) translateY(${lt.toFixed(2)}px)`; if(Math.abs(tx-cx)>.05||Math.abs(ty-cy)>.05||Math.abs(lift-lt)>.05) raf4=requestAnimationFrame(apply); else raf4=0; };
    const kick=()=>{ if(!raf4) raf4=requestAnimationFrame(apply); };
    const onMove=(e)=>{ const r=el.getBoundingClientRect(); const px=(e.clientX-r.left)/r.width-.5; const py=(e.clientY-r.top)/r.height-.5; tx=px*max*2; ty=-py*max*2; lift=-6; kick(); };
    const onLeave=()=>{ tx=0; ty=0; lift=0; kick(); };
    el.addEventListener("mousemove",onMove); el.addEventListener("mouseleave",onLeave);
    return ()=>{ cancelAnimationFrame(raf4); el.removeEventListener("mousemove",onMove); el.removeEventListener("mouseleave",onLeave); el.style.transform=""; };
  },[max]);
  return ref;
}

}

function Founder(){
  const { t }=useT();
  const frameRef=React.useRef(null);
  React.useEffect(()=>{
    const el=frameRef.current;
    if(!el) return;
    let raf5=0;
    const onScroll=()=>{
      if(raf5) return;
      raf5=requestAnimationFrame(()=>{
        const r=el.getBoundingClientRect();
        const prog=(window.innerHeight-r.top)/(window.innerHeight+r.height);
        const y=Math.max(-26,Math.min(26,(prog-.5)*-52));
        el.style.transform=`translateY(${y}px)`;
        raf5=0;
      });
    };
    window.addEventListener("scroll",onScroll,{ passive:true });
    onScroll();
    return ()=>window.removeEventListener("scroll",onScroll);
  },[]);
  const points=["founder.p1","founder.p2","founder.p3","founder.p4"];
  return(
    <section className="s-dark s-pad" id="about">
      <div className="container founder-inner">
        <Reveal className="founder-photo">
          <div className="frame" ref={frameRef}>
            <img src="https://raw.githubusercontent.com/secfirm/Consulting/main/Portrait.jpg" alt="Jesse Lopez"
                 onError={(e)=>{ e.target.style.display='none'; e.target.parentElement.style.background='linear-gradient(135deg,#0D1B2A,#11253A)'; }}/>
          </div>
          <div className="founder-badge">
            <div className="n">{t("founder.badgeN")}</div>
            <div className="l">{t("founder.badgeL")}</div>
          </div>
        </Reveal>
        <Reveal delay="d1">
          <span className="eyebrow">{t("founder.eyebrow")}</span>
          <div className="draw-line" style={{ marginTop:14 }} />
          <h2 style={{ fontFamily:"var(--font-display)",fontWeight:800,fontSize:"clamp(1.9rem,3.2vw,2.7rem)",color:"var(--navy)",letterSpacing:"-.02em",margin:"14px 0 16px",lineHeight:1.14 }}>
            {t("founder.title")}
          </h2>
          <p style={{ color:"var(--ink-600)",fontSize:"1.06rem" }}>{t("founder.body")}</p>
          <ul className="founder-list">
            {points.map(p=>(
              <li key={p}><Icon name="check-circle-2" />{t(p)}</li>
            ))}

        </Reveal>

    </section>
  );

    setLangState(l);

  React.useEffect(()=>{
    const spot=document.getElementById("spotlight");
    if(!spot) return;
    const onMove=(e)=>{ spot.style.setProperty("--mx",e.clientX+"px"); spot.style.setProperty("--my",e.clientY+"px"); };
    window.addEventListener("mousemove",onMove);
    return ()=>window.removeEventListener("mousemove",onMove);
  },[]);
  return(
    <I18nContext.Provider value={{ lang, setLang, t }}>
      <CustomCursor />
      <Nav />
      <Hero />
      <Work />
      <Services />
      <Founder />
      <Community />
      <Proof />
      <CTA />
      <Footer />
      
    </I18nContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
