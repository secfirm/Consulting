<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jesse Lopez Consulting — Enterprise Workflow Modernization</title>
<link rel="icon" type="image/png" href="/FavIconBlue.png">
<link rel="stylesheet" href="kit.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="spotlight" id="spotlight"></div>
<div id="root"></div>

<script type="text/babel" src="lib.jsx"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Body.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="Extras.jsx"></script>
<script type="text/babel" data-presets="react">
function App() {
  const [lang, setLangState] = React.useState(
    (typeof localStorage !== "undefined" && localStorage.getItem("jlc-lang")) || "en"
  );
  const setLang = (l) => {
    setLangState(l);
    try { localStorage.setItem("jlc-lang", l); } catch (e) {}
    document.documentElement.lang = l;
  };
  const t = React.useCallback(
    (k) => (DICT[lang] && DICT[lang][k]) || DICT.en[k] || k,
    [lang]
  );

  React.useEffect(() => {
    const spot = document.getElementById("spotlight");
    if (!spot) return;
    const onMove = (e) => {
      spot.style.setProperty("--mx", e.clientX + "px");
      spot.style.setProperty("--my", e.clientY + "px");
    };
    window.addEventListener("mousemove", onMove);
    return () => window.removeEventListener("mousemove", onMove);
  }, []);

  return (
    <I18nContext.Provider value={{ lang, setLang, t }}>
      <CustomCursor />
      <Nav />
      <Hero />
      <Work />
      <Services />
      <Lifecycle />
      <Stats />
      <Founder />
      <Community />
      <CTA />
      <Contact />
      <Footer />
      <ChatWidget />
    </I18nContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
