/* ============================================================
   Jesse Lopez Consulting — Homepage Redesign · Kit Styles
   ============================================================ */
@import url('../../colors_and_type.css');

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--navy-900);
  color: var(--fg-1);
  font-size: 16px;
  line-height: 1.7;
  overflow-x: hidden;
}

a { text-decoration: none; color: inherit; }
img { display: block; max-width: 100%; }

.container { max-width: 1180px; margin: 0 auto; padding: 0 28px; position: relative; z-index: 2; }

/* cursor spotlight */
.spotlight {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(560px circle at var(--mx, 50%) var(--my, 30%),
              rgba(20,184,166,0.06), transparent 75%);
}

/* ---- CUSTOM CURSOR ------------------------------------ */
@media (pointer: fine) {
  body.has-cursor, body.has-cursor * { cursor: none !important; }
}
.cursor-dot, .cursor-ring {
  position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
  will-change: transform;
}
.cursor-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--teal-400); box-shadow: 0 0 10px rgba(45,212,191,.7);
  mix-blend-mode: screen;
}
.cursor-ring {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1.5px solid rgba(45,212,191,.55);
  transition: width .18s ease-out, height .18s ease-out, border-color .18s ease-out, background .18s ease-out, opacity .18s ease-out;
}
.cursor-ring.hot {
  width: 46px; height: 46px;
  border-color: rgba(45,212,191,.9);
  background: rgba(20,184,166,.1);
  box-shadow: 0 0 28px rgba(20,184,166,.35);
  margin-top: -7px; margin-left: -7px;
}
.cursor-ring.press { transform: translate(var(--rx),var(--ry)) scale(.78); opacity: .8; }

/* ---- HEAD CARET (typewriter section headings) --------- */
.head-caret {
  display: inline-block; width: 3px; height: .92em;
  background: var(--teal-400); margin-left: 4px; transform: translateY(2px);
  animation: blink 1s steps(1) infinite;
}

/* ---- REVEAL (scroll fade-up, JS/rAF-driven) ----------- */
.reveal { will-change: opacity, transform; }
.d1, .d2, .d3, .d4, .d5 { }

/* ---- EYEBROW + SECTION HEADING ------------------------ */
.eyebrow {
  display: inline-block; font-family: var(--font-display); font-size: 12px;
  font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--teal-500);
}
.eyebrow.on-dark { color: var(--teal-400); }
.heading-wrap { position: relative; }
.draw-line {
  height: 3px; width: 0; background: linear-gradient(90deg, var(--teal-500), var(--teal-400));
  border-radius: 2px;
}
.draw-line.center { margin: 0 auto; }

/* ---- BUTTONS ------------------------------------------ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 15px 30px; border-radius: var(--r-sm); font-family: var(--font-display);
  font-weight: 600; font-size: 14.5px; letter-spacing: .03em; cursor: pointer;
  border: none; transition: transform .18s var(--ease-out), filter .18s var(--ease-out), box-shadow .18s var(--ease-out), background .18s var(--ease-out), color .18s var(--ease-out), border-color .18s var(--ease-out);
  position: relative; overflow: hidden; white-space: nowrap;
}
.btn:hover { transform: translateY(-2px); }
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: linear-gradient(135deg, var(--teal-400), var(--teal-500)); color: var(--navy-900); box-shadow: var(--shadow-teal); }
.btn-primary:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 14px 36px rgba(20,184,166,.45); }
/* shimmer sweep */
.btn-primary::after {
  content: ''; position: absolute; top: 0; left: -120%; width: 70%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
  transform: skewX(-18deg); animation: shimmer 3.6s ease-in-out infinite;
}
@keyframes shimmer { 0%,60% { left: -120%; } 100% { left: 160%; } }
/* pulse ring */
.btn-pulse { position: relative; }
.btn-pulse::before {
  content: ''; position: absolute; inset: 0; border-radius: var(--r-sm);
  box-shadow: 0 0 0 0 rgba(20,184,166,.5); animation: pulse 2.4s var(--ease-out) infinite;
}
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(20,184,166,.5);} 70% { box-shadow: 0 0 0 16px rgba(20,184,166,0);} 100% { box-shadow: 0 0 0 0 rgba(20,184,166,0);} }
.btn-ghost { background: transparent; border: 1.5px solid rgba(20,184,166,.4); color: var(--teal-400); }
.btn-ghost:hover { border-color: var(--teal-400); background: rgba(20,184,166,.08); transform: translateY(-2px); }
.btn-light { background: var(--navy-700); color: #fff; }
.btn-light:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.btn-soft {
  background: rgba(255,255,255,.06); color: #fff; border: 1px solid rgba(255,255,255,.1);
}
.btn-soft:hover { background: rgba(255,255,255,.1); border-color: rgba(20,184,166,.32); }

/* ============================================================
   NAV
   ============================================================ */
.nav {
  position: sticky; top: 0; z-index: 100; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  background: rgba(5,11,20,.78); border-bottom: 1px solid rgba(20,184,166,.09); transition: background .3s;
}
.nav-inner { display: flex; align-items: center; justify-content: space-between; height: 78px; }
.brand-lockup { display: flex; align-items: center; gap: 12px; }
.brand-lockup .bmark { height: 40px; width: auto; }
.brand-lockup .bword { display: flex; flex-direction: column; line-height: 1; }
.brand-lockup .bword b { font-family: var(--font-display); font-weight: 700; font-size: 19px; color: #fff; letter-spacing: -.01em; }
.brand-lockup .bword i { font-family: var(--font-display); font-style: normal; font-weight: 600; font-size: 9.5px; letter-spacing: .34em; text-transform: uppercase; color: var(--teal-400); margin-top: 4px; }
.brand-lockup.sm .bmark { height: 34px; }
.brand-lockup.sm .bword b { font-size: 17px; }
.nav-logo { height: 38px; width: auto; display: block; }
.nav-cta { color: var(--navy-900) !important; }
.nav-right { display: flex; align-items: center; gap: 22px; }
.nav-linkedin {
  display: inline-flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; border-radius: 10px;
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
  color: var(--slate); transition: color .18s, background .18s, border-color .18s, transform .18s;
}
.nav-linkedin:hover { color: var(--teal-400); border-color: rgba(20,184,166,.4); background: rgba(20,184,166,.08); transform: translateY(-1px); }
.nav-linkedin svg { width: 18px; height: 18px; }
.contact-card .cc-ico svg { width: 22px; height: 22px; }
.nav-cta { padding: 10px 18px; font-size: 13px; gap: 7px; }
.nav-cta svg { width: 16px; height: 16px; }
.nav-links { display: flex; align-items: center; gap: 30px; }
.nav-links a {
  font-family: var(--font-display); font-size: 13px; font-weight: 500; letter-spacing: .04em;
  text-transform: uppercase; color: var(--slate); position: relative; padding: 6px 0; transition: color .3s;
}
.nav-links a::after { content: ''; position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--teal-400); transition: width .3s var(--ease-out); }
.nav-links a:hover { color: var(--teal-400); }
.nav-links a:hover::after { width: 100%; }

/* lang toggle */
.lang { display: flex; position: relative; width: 78px; height: 32px; padding: 2px;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09); border-radius: var(--r-pill); }
.lang button { flex: 1; z-index: 2; border: none; background: none; cursor: pointer; font-family: var(--font-display);
  font-size: 11px; font-weight: 700; color: var(--slate); transition: color .3s; }
.lang button.on { color: var(--navy-900); }
.lang-slider { position: absolute; top: 2px; left: 2px; width: 35px; height: 26px; border-radius: var(--r-pill);
  background: var(--teal-400); transition: transform .35s var(--ease-out); }
.lang.es .lang-slider { transform: translateX(37px); }

/* ============================================================
   HERO
   ============================================================ */
.hero { position: relative; min-height: 92vh; display: flex; align-items: flex-start; overflow: hidden; padding: 100px 0 70px; }
.hero-bg { position: absolute; inset: 0; z-index: 0; }
.hero-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-glow {
  position: absolute; inset: 0;
  background:
    radial-gradient(680px circle at 82% 18%, rgba(20,184,166,.16), transparent 60%),
    radial-gradient(560px circle at 8% 88%, rgba(20,184,166,.08), transparent 60%);
  animation: drift 16s ease-in-out infinite alternate;
}
.hero-breathe {
  position: absolute; inset: -10%;
  background:
    radial-gradient(900px circle at 50% 50%, rgba(15,138,126,.22), transparent 60%),
    linear-gradient(135deg, #050B14, #0A2540 45%, #0E3B40 70%, #050B14);
  filter: blur(40px);
  animation: breathe 9s ease-in-out infinite alternate;
  opacity: .9;
}
@keyframes breathe {
  0%   { transform: scale(1)   translate(0, 0);   filter: blur(38px) hue-rotate(0deg); }
  50%  { transform: scale(1.06) translate(-1.2%, .8%); filter: blur(48px) hue-rotate(-6deg); }
  100% { transform: scale(1.03) translate(1%, -1%);    filter: blur(42px) hue-rotate(4deg); }
}
@keyframes drift { 0% { transform: translate3d(0,0,0) scale(1);} 100% { transform: translate3d(-2%,1.5%,0) scale(1.06);} }
.hero-grid {
  position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(rgba(20,184,166,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(20,184,166,.04) 1px, transparent 1px);
  background-size: 64px 64px; mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 80%);
}
.hero-inner { display: grid; grid-template-columns: 1.18fr 1fr; gap: 56px; align-items: center; }
.hero h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.3rem, 4.6vw, 3.9rem); line-height: 1.1; letter-spacing: -.025em; color: #fff; margin: 22px 0 14px; }
.hero h1 .grad { background: linear-gradient(120deg, var(--teal-400), var(--teal-600)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.type-line { font-family: var(--font-display); font-weight: 700; font-size: clamp(1rem, 1.6vw, 1.3rem); color: var(--teal-400); min-height: 1.6em; margin-bottom: 24px; letter-spacing: .01em; width: 100%; max-width: 100%; overflow: visible; white-space: normal; display: block; }
.type-cursor { display: inline-block; width: 2px; height: 1.05em; background: var(--teal-400); margin-left: 3px; transform: translateY(3px); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.hero-sub { font-size: 1.12rem; color: var(--fg-2); max-width: 540px; margin-bottom: 34px; }
.hero-actions { display: flex; gap: 15px; flex-wrap: wrap; }
.hero-trust { display: flex; align-items: center; gap: 22px; margin-top: 36px; color: var(--slate); font-size: 13px; }
.hero-trust .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--teal-500); }
.hero-trust b { color: var(--fg-1); font-family: var(--font-display); }

/* ROI calc card */
.calc {
  position: relative; background: var(--card-dark); border: 1px solid var(--card-dark-border);
  border-radius: var(--r-lg); padding: 30px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow-lg);
}
.calc-head { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; margin-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,.07); }
.calc-head .ico { width: 40px; height: 40px; border-radius: 10px; background: rgba(20,184,166,.12); display: flex; align-items: center; justify-content: center; color: var(--teal-400); flex: none; }
.calc-head h3 { font-family: var(--font-display); font-size: 1.15rem; color: #fff; }
.calc-head p { font-size: .8rem; color: var(--slate); }
.calc-g { margin-bottom: 18px; }
.calc-lr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
.calc-lr label { font-size: .84rem; color: var(--fg-2); font-weight: 500; }
.calc-val { font-family: var(--font-display); font-weight: 700; font-size: .92rem; color: var(--teal-400); }
.slider { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px; background: rgba(255,255,255,.09); outline: none; }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--teal-400); border: 2px solid #fff; box-shadow: 0 0 10px rgba(20,184,166,.5); cursor: pointer; transition: transform .12s; }
.slider::-webkit-slider-thumb:hover { transform: scale(1.18); }
.slider::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--teal-400); border: 2px solid #fff; cursor: pointer; }
.presets { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 22px; }
.preset { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); border-radius: 6px; padding: 9px 4px;
  font-family: var(--font-display); font-size: .72rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--slate); cursor: pointer; transition: all .3s; }
.preset:hover { border-color: rgba(20,184,166,.4); color: var(--teal-400); }
.preset.on { background: rgba(20,184,166,.1); border-color: var(--teal-500); color: var(--teal-400); box-shadow: 0 0 12px rgba(20,184,166,.16); }
.calc-out { background: rgba(5,11,20,.5); border: 1px solid rgba(255,255,255,.06); border-radius: var(--r-md); padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; text-align: center; }
.calc-out .v { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1.1; color: var(--teal-400); display: inline-flex; align-items: baseline; gap: 8px; }
.calc-out .v.save { background: linear-gradient(135deg, #fff 30%, var(--teal-400)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.calc-out .v .cap-tag { font-family: var(--font-display); font-size: .58rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--teal-400); background: rgba(20,184,166,.14); border: 1px solid rgba(20,184,166,.3); padding: 2px 7px; border-radius: 4px; -webkit-text-fill-color: var(--teal-400); }
.calc-out .l { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--slate); margin-top: 5px; }

/* denial-recovery bonus row + footnote */
.calc-bonus {
  display: flex; align-items: center; gap: 14px; margin-top: 14px;
  background: linear-gradient(135deg, rgba(20,184,166,.12), rgba(20,184,166,.04));
  border: 1px solid rgba(45,212,191,.28); border-radius: var(--r-md); padding: 14px 18px;
  animation: bonusIn .4s var(--ease-out);
}
@keyframes bonusIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.calc-bonus .cb-icon { width: 36px; height: 36px; border-radius: 9px; background: rgba(20,184,166,.16); color: var(--teal-400); display: flex; align-items: center; justify-content: center; flex: none; }
.calc-bonus .cb-icon svg { width: 18px; height: 18px; }
.calc-bonus .cb-meta { flex: 1; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.calc-bonus .cb-l { font-size: .76rem; color: var(--fg-2); font-weight: 500; }
.calc-bonus .cb-v { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; color: var(--teal-400); }
.calc-foot { margin-top: 14px; font-size: .68rem; color: var(--slate); line-height: 1.5; font-style: italic; }

/* ============================================================
   SECTION SCAFFOLD
   ============================================================ */
section { position: relative; }
.s-dark { background: var(--navy-800); }
.s-darker { background: var(--navy-900); }
.s-light { background: var(--paper-100); color: var(--ink-900); }
.s-pad { padding: 116px 0; }
.s-head { margin-bottom: 60px; }
.s-head.center { text-align: center; }
.s-head h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.9rem, 3.2vw, 2.7rem); letter-spacing: -.02em; line-height: 1.14; margin: 14px 0 16px; }
.s-light .s-head h2 { color: var(--navy); }
.s-dark .s-head h2, .s-darker .s-head h2 { color: #fff; }
.s-head p { max-width: 580px; font-size: 1.06rem; }
.s-head.center p { margin: 0 auto; }
.s-light .s-head p { color: var(--ink-600); }
.s-dark .s-head p, .s-darker .s-head p { color: var(--fg-2); }

/* ---- PROOF (logos + quotes) --------------------------- */
.proof-rail { display: flex; align-items: center; justify-content: center; gap: 38px; flex-wrap: wrap; padding-bottom: 56px; margin-bottom: 56px; border-bottom: 1px solid var(--paper-200); }
.proof-rail .t { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-400); }
.tool { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: #9aa7b5; letter-spacing: -.01em; transition: color .3s, transform .3s; cursor: default; }
.tool:hover { color: var(--teal-700); transform: translateY(-2px); }
.quotes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
.quote { background: #fff; border: 1px solid var(--paper-200); border-radius: var(--r-md); padding: 32px 30px; box-shadow: var(--shadow-sm); transition: transform .35s var(--ease-out), box-shadow .35s var(--ease-out); }
.quote:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }
.quote .stars { color: var(--teal-500); display: flex; gap: 3px; margin-bottom: 14px; }
.quote .stars svg { width: 16px; height: 16px; fill: var(--teal-500); stroke: none; }
.quote p { font-size: .98rem; color: #334155; line-height: 1.65; margin-bottom: 22px; }
.quote .who { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--navy); }
.quote .role { font-size: 12px; color: var(--ink-400); margin-top: 2px; }

/* ---- SERVICES (flip cards) ---------------------------- */
.svc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.flip { perspective: 1400px; height: 256px; }
.flip-in { position: relative; width: 100%; height: 100%; transition: transform .45s var(--ease-out); transform-style: preserve-3d; }
.flip:hover .flip-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--r-md); padding: 30px; display: flex; flex-direction: column; will-change: transform; }
.face-front { background: linear-gradient(160deg, #ffffff 0%, #f9fbfd 100%); border: 1px solid var(--paper-200); box-shadow: var(--shadow-sm); transition: box-shadow .18s var(--ease-out); }
.flip:hover .face-front { box-shadow: var(--shadow-lg); }
.face-front::before {
  content: ''; position: absolute; inset: 0; border-radius: var(--r-md);
  background:
    radial-gradient(220px circle at var(--gx,50%) var(--gy,50%), rgba(20,184,166,.16), transparent 65%);
  opacity: 0; transition: opacity .25s ease-out; pointer-events: none;
}
.flip:hover .face-front::before { opacity: 1; }
.face-front .ico { width: 48px; height: 48px; border-radius: 12px; background: rgba(20,184,166,.1); color: var(--teal-700); display: flex; align-items: center; justify-content: center; margin-bottom: auto; }
.face-front .ico svg { width: 24px; height: 24px; }
.svc-num { font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--teal-700); margin-bottom: 8px; }
.face-front h3 { font-family: var(--font-display); font-size: 1.18rem; color: var(--navy); }

.face-back { background: linear-gradient(150deg, var(--navy-700), var(--navy-600)); border: 1px solid var(--teal-500); transform: rotateY(180deg); justify-content: center; }

.face-back .go svg { width: 15px; height: 15px; transition: transform .3s; }
.flip:hover .face-back .go svg { transform: translateX(4px); }

/* ---- HOW WE WORK -------------------------------------- */
.work-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; position: relative; }

.work-num { width: 60px; height: 60px; margin: 0 auto 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center;

.work-step h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: #ffffff !important; margin-bottom: 10px; display: block; visibility: visible; }

/* ---- STATS (counters) --------------------------------- */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; max-width: 980px; margin: 0 auto; }
.stat-card { position: relative; background: var(--card-dark); border: 1px solid var(--card-dark-border); border-radius: var(--r-lg); padding: 38px 26px; text-align: center; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); overflow: hidden; }

.stat-card .ico { color: var(--teal-400); margin-bottom: 14px; display: inline-flex; }
.stat-card .ico svg { width: 26px; height: 26px; }

/* ---- FOUNDER ------------------------------------------ */
.founder-inner { display: grid; grid-template-columns: .9fr 1.1fr; gap: 64px; align-items: center; }

.footer-bot { display: flex; justify-content: space-between; align-items: center; padding-top: 24px; color: var(--fg-3); font-size: 12px; }

.footer-bot .tags .s { width: 3px; height: 3px; border-radius: 50%; background: var(--fg-3); }

/* ============================================================
   COMMUNITY MISSION
   ============================================================ */
.comm { position: relative; overflow: hidden; background: var(--navy-900); padding: 124px 0; }

/* ============================================================

.contact-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.contact-card {

.contact-card .cc-ico {

}

.contact-foot { text-align: center; margin-top: 36px; color: var(--ink-400); font-size: .9rem; }

/* ============================================================
   CHAT WIDGET
   ============================================================ */
.chat-fab {
  position: fixed; right: 22px; bottom: 22px; z-index: 200;
  width: 60px; height: 60px; border-radius: 50%;

.chat-fab .fab-ring {

}
@keyframes fabPulse {
  0% { box-shadow: 0 0 0 0 rgba(20,184,166,.55); }
  70% { box-shadow: 0 0 0 18px rgba(20,184,166,0); }
  100% { box-shadow: 0 0 0 0 rgba(20,184,166,0); }
}
.chat-fab .fab-label {
  position: absolute; right: 70px; top: 50%; transform: translateY(-50%);

.chat-panel {

}
.chat-panel.open { opacity: 1; transform: none; pointer-events: auto; }
.cp-head { display: flex; align-items: center; gap: 12px; padding: 18px 18px 16px; border-bottom: 1px solid rgba(255,255,255,.06); background: linear-gradient(135deg, rgba(20,184,166,.12), transparent 70%); }

.cp-name { font-family: var(--font-display); font-weight: 700; color: #fff; font-size: 14px; }
.cp-role { font-size: 11.5px; color: var(--slate); margin-top: 2px; }
.cp-x { width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); color: var(--slate); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: color .18s, background .18s; }
.cp-x:hover { color: #fff; background: rgba(255,255,255,.1); }
.cp-x svg { width: 16px; height: 16px; }
.cp-body { padding: 18px; }

/* Appointment Lifecycle Specialist tagline */
.hero-specialist {

}

/* ---------- Cross-page link helper ----------

function jlcPage() {

function hashHref(hash) {

}

/* ---------- Lucide icon (React-safe injection) ---------- */
function Icon({ name, size, className }) {
  // Inline SVG for icons Lucide's CDN bundle is missing
  if (name === "linkedin") {
    return (
      <svg className={className} viewBox="0 0 24 24" width={size || undefined} height={size || undefined}
           fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/>
      </svg>
    );
  }
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el || !window.lucide) return;
    el.innerHTML = `<i data-lucide="${name}"></i>`;
    window.lucide.createIcons();
    const svg = el.querySelector('svg');
    if (svg && size) { svg.setAttribute('width', size); svg.setAttribute('height', size); }
  }, [name, size]);
  return <span ref={ref} className={className} style={{ display: 'inline-flex', lineHeight: 0 }} />;
}

/* ---------- Reveal on scroll (rAF-driven, timeline-independent) ---------- */
const REVEAL_DELAY = { d1: 90, d2: 180, d3: 270, d4: 360, d5: 450 };
function Reveal({ children, className = "", delay = "", as = "div", style }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let raf = 0, io = null, started = false;
    const line = el.querySelector(".draw-line");
    const begin = () => {
      if (started) return;
      started = true;
      el.classList.add("in");
      const dur = 760, wait = REVEAL_DELAY[delay] || 0;
      let t0 = null;
      const tick = (now) => {
        if (t0 === null) t0 = now + wait;
        const p = Math.max(0, Math.min(1, (now - t0) / dur));
        const e = 1 - Math.pow(1 - p, 3);
        el.style.opacity = e.toFixed(3);
        el.style.transform = p < 1 ? `translateY(${((1 - e) * 34).toFixed(2)}px)` : "none";
        if (line) line.style.width = (e * 64).toFixed(1) + "px";
        if (p < 1) raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    };
    const r = el.getBoundingClientRect();
    if (r.top < window.innerHeight * 0.94 && r.bottom > 0) {
      begin();
    } else {
      io = new IntersectionObserver((entries) => {
        entries.forEach((en) => { if (en.isIntersecting) { begin(); io.unobserve(en.target); } });
      }, { threshold: 0.16, rootMargin: "0px 0px -6% 0px" });
      io.observe(el);
    }
    return () => { if (raf) cancelAnimationFrame(raf); if (io) io.disconnect(); };
  }, []);
  const Tag = as;
  return (
    <Tag ref={ref} className={`reveal ${delay} ${className}`}
         style={{ opacity: 0, transform: "translateY(34px)", ...style }}>
      {children}
    </Tag>
  );
}

/* ---------- Count-up number ---------- */
function Counter({ value, prefix = "", suffix = "", decimals = 0, duration = 1600 }) {
  const ref = React.useRef(null);
  const [n, setN] = React.useState(0);
  const done = React.useRef(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting && !done.current) {
          done.current = true;
          const start = performance.now();
          const tick = (now) => {
            const p = Math.min((now - start) / duration, 1);
            const eased = 1 - Math.pow(1 - p, 3);
            setN(value * eased);
            if (p < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        }
      });
    }, { threshold: 0.5 });
    io.observe(el);
    return () => io.disconnect();
  }, [value]);
  const display = n.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  return <span ref={ref}>{prefix}{display}{suffix}</span>;
}

/* ---------- Typewriter ---------- */
function Typewriter({ words, className }) {
  const [txt, setTxt] = React.useState("");
  const [wi, setWi] = React.useState(0);
  const [del, setDel] = React.useState(false);
  React.useEffect(() => {
    const word = words[wi % words.length];
    let to;
    if (!del && txt === word) {
      to = setTimeout(() => setDel(true), 1500);
    } else if (del && txt === "") {
      setDel(false); setWi((i) => i + 1);
    } else {
      to = setTimeout(() => {
        setTxt(del ? word.slice(0, txt.length - 1) : word.slice(0, txt.length + 1));
      }, del ? 38 : 70);
    }
    return () => clearTimeout(to);
  }, [txt, del, wi, words]);
  return <div className={className}>{txt}<span className="type-cursor" /></div>;
}

/* ---------- Particle field — drifts away from cursor ---------- */
function Particles() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const canvas = ref.current;
    const ctx = canvas.getContext("2d");
    let raf, w, h, pts = [];
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    const mouse = { x: -9999, y: -9999, on: false };
    const REPEL = 130, LINK = 132;

    function resize() {
      w = canvas.clientWidth; h = canvas.clientHeight;
      canvas.width = w * DPR; canvas.height = h * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const count = Math.min(72, Math.floor(w / 20));
      pts = Array.from({ length: count }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.26, vy: (Math.random() - 0.5) * 0.26,
        r: Math.random() * 1.7 + 0.7
      }));
    }
    function onMove(e) {
      const r = canvas.getBoundingClientRect();
      mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; mouse.on = true;
    }
    function onLeave() { mouse.on = false; mouse.x = mouse.y = -9999; }

    function frame() {
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        if (mouse.on) {
          const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
          if (d < REPEL && d > 0.01) {
            const f = (1 - d / REPEL) * 0.85;
            p.vx += (dx / d) * f; p.vy += (dy / d) * f;
          }
        }
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.95; p.vy *= 0.95;
        if (Math.hypot(p.vx, p.vy) < 0.15) { p.vx += (Math.random() - 0.5) * 0.06; p.vy += (Math.random() - 0.5) * 0.06; }
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;
        p.x = Math.max(0, Math.min(w, p.x)); p.y = Math.max(0, Math.min(h, p.y));
        const near = mouse.on && Math.hypot(p.x - mouse.x, p.y - mouse.y) < REPEL;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = near ? "rgba(45,212,191,0.95)" : "rgba(45,212,191,0.5)"; ctx.fill();
        for (let j = i + 1; j < pts.length; j++) {
          const q = pts[j], dx = p.x - q.x, dy = p.y - q.y, d = Math.hypot(dx, dy);
          if (d < LINK) {
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
            ctx.strokeStyle = `rgba(20,184,166,${0.18 * (1 - d / LINK)})`;
            ctx.lineWidth = 1; ctx.stroke();
          }
        }
        if (near) {
          const d2 = Math.hypot(p.x - mouse.x, p.y - mouse.y);
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y);
          ctx.strokeStyle = `rgba(45,212,191,${0.22 * (1 - d2 / REPEL)})`;
          ctx.lineWidth = 1; ctx.stroke();
        }
      }
      raf = requestAnimationFrame(frame);
    }
    resize(); frame();
    window.addEventListener("resize", resize);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseout", onLeave);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", resize);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseout", onLeave);
    };
  }, []);
  return <canvas ref={ref} className="hero-canvas" />;
}

/* ---------- Custom cursor: teal dot + lagging ring ---------- */
function CustomCursor() {
  React.useEffect(() => {
    if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) return;
    const dot = document.createElement("div");
    const ring = document.createElement("div");
    dot.className = "cursor-dot"; ring.className = "cursor-ring";
    document.body.appendChild(dot); document.body.appendChild(ring);
    document.body.classList.add("has-cursor");
    let mx = innerWidth / 2, my = innerHeight / 2, rx = mx, ry = my, raf;
    const onMove = (e) => {
      mx = e.clientX; my = e.clientY;
      dot.style.transform = `translate(${mx - 4}px, ${my - 4}px)`;
    };
    const hot = (t) => t.closest && t.closest('a, button, .flip, .preset, input, .lang, [data-tilt]');
    const onOver = (e) => { if (hot(e.target)) ring.classList.add("hot"); };
    const onOut  = (e) => { if (hot(e.target)) ring.classList.remove("hot"); };
    const onDown = () => ring.classList.add("press");
    const onUp   = () => ring.classList.remove("press");
    const loop = () => {
      rx += (mx - rx) * 0.22; ry += (my - ry) * 0.22;
      ring.style.transform = `translate(${rx - 16}px, ${ry - 16}px)`;
      raf = requestAnimationFrame(loop);
    };
    loop();
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseover", onOver);
    window.addEventListener("mouseout", onOut);
    window.addEventListener("mousedown", onDown);
    window.addEventListener("mouseup", onUp);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseover", onOver);
      window.removeEventListener("mouseout", onOut);
      window.removeEventListener("mousedown", onDown);
      window.removeEventListener("mouseup", onUp);
      dot.remove(); ring.remove();
      document.body.classList.remove("has-cursor");
    };
  }, []);
  return null;
}

/* ---------- Magnetic: gentle pull toward cursor ---------- */
function Magnetic({ children, strength = 14, className = "", style }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el || (window.matchMedia && window.matchMedia("(pointer: coarse)").matches)) return;
    let raf = 0, tx = 0, ty = 0, cx = 0, cy = 0;
    const apply = () => {
      cx += (tx - cx) * 0.18; cy += (ty - cy) * 0.18;
      el.style.transform = `translate(${cx.toFixed(2)}px, ${cy.toFixed(2)}px)`;
      if (Math.abs(tx - cx) > 0.05 || Math.abs(ty - cy) > 0.05) raf = requestAnimationFrame(apply);
      else raf = 0;
    };
    const kick = () => { if (!raf) raf = requestAnimationFrame(apply); };
    const onMove = (e) => {
      const r = el.getBoundingClientRect();
      const cxp = r.left + r.width / 2, cyp = r.top + r.height / 2;
      const dx = e.clientX - cxp, dy = e.clientY - cyp;
      const dist = Math.hypot(dx, dy);
      const R = Math.max(r.width, r.height) * 1.2;
      if (dist > R) { tx = 0; ty = 0; }
      else {
        const fall = 1 - dist / R;
        tx = (dx / R) * strength * fall * 2;
        ty = (dy / R) * strength * fall * 2;
      }
      kick();
    };
    window.addEventListener("mousemove", onMove);
    return () => { cancelAnimationFrame(raf); window.removeEventListener("mousemove", onMove); el.style.transform = ""; };
  }, [strength]);
  return <div ref={ref} className={className} style={{ willChange: "transform", display: "inline-block", ...style }}>{children}</div>;
}

/* ---------- TypeReveal: section heading types itself in view ---------- */
function TypeReveal({ text, as = "h2", className = "", speed = 22 }) {
  const ref = React.useRef(null);
  const [shown, setShown] = React.useState("");
  const done = React.useRef(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    // Reset for re-runs (e.g. language switch)
    done.current = false;
    setShown("");
    const start = () => {
      if (done.current) return; done.current = true;
      let i = 0;
      const step = () => {
        i++; setShown(text.slice(0, i));
        if (i < text.length) setTimeout(step, speed);
      };
      step();
    };
    const r = el.getBoundingClientRect();
    if (r.top < innerHeight * 1.2 && r.bottom > -200) { start(); return; }
    const io = new IntersectionObserver((es) => {
      es.forEach((e) => { if (e.isIntersecting) { start(); io.unobserve(e.target); } });
    }, { threshold: 0.3 });
    io.observe(el);
    const fallback = setTimeout(start, 2200);
    return () => { io.disconnect(); clearTimeout(fallback); };
  }, [text, speed]);
  const Tag = as;
  const inProgress = shown.length < text.length;
  return (
    <Tag ref={ref} className={className} style={{ minHeight: "1.14em" }}>
      {shown}
      {inProgress && <span className="head-caret" />}
    </Tag>
  );
}

/* ---------- useTilt: 3D tilt toward the cursor ---------- */
function useTilt(max = 9) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el || (window.matchMedia && window.matchMedia("(pointer: coarse)").matches)) return;
    let raf = 0, tx = 0, ty = 0, cx = 0, cy = 0, lift = 0, lt = 0;
    const apply = () => {
      cx += (tx - cx) * 0.18; cy += (ty - cy) * 0.18; lt += (lift - lt) * 0.18;
      el.style.transform = `perspective(900px) rotateX(${cy.toFixed(2)}deg) rotateY(${cx.toFixed(2)}deg) translateY(${lt.toFixed(2)}px)`;
      if (Math.abs(tx - cx) > 0.05 || Math.abs(ty - cy) > 0.05 || Math.abs(lift - lt) > 0.05) raf = requestAnimationFrame(apply);
      else raf = 0;
    };
    const kick = () => { if (!raf) raf = requestAnimationFrame(apply); };
    const onMove = (e) => {
      const r = el.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5;
      const py = (e.clientY - r.top) / r.height - 0.5;
      tx = px * max * 2; ty = -py * max * 2; lift = -6; kick();
    };
    const onLeave = () => { tx = 0; ty = 0; lift = 0; kick(); };
    el.addEventListener("mousemove", onMove);
    el.addEventListener("mouseleave", onLeave);
    return () => { cancelAnimationFrame(raf); el.removeEventListener("mousemove", onMove); el.removeEventListener("mouseleave", onLeave); el.style.transform = ""; };
  }, [max]);
  return ref;
}

function RoiCalc() {
  const { t } = useT();
  const [team, setTeam] = React.useState(15);
  const [hours, setHours] = React.useState(10);
  const [rate, setRate] = React.useState(45);
  const [state, setState] = React.useState("chaotic");

  const CAP = 15_000_000;
  // Process state → (automation rate, rework factor)
  const tuning = {
    mild:    { auto: 0.25, rework: 1.15 },
    chaotic: { auto: 0.45, rework: 1.35 },
    archaic: { auto: 0.65, rework: 1.55 },
  };
  const { auto, rework } = tuning[state];

  // HOURS RECLAIMED = Team × Hours/Wk × Automation Rate × 52
  const reclaimed = Math.round(team * hours * auto * 52);
  // ANNUAL SAVINGS = Hours × Rate × Rework Factor, capped
  const rawSavings = Math.round(reclaimed * rate * rework);
  const savings = Math.min(rawSavings, CAP);
  const cappedFlag = rawSavings > CAP;

  // Denial recovery (Chaotic / Archaic only):
  // (Annual Claims × 10% × 65% recovery × $350); default claims = Team × 40
  const showDenial = state !== "mild";
  const annualClaims = team * 40;
  const denial = Math.round(annualClaims * 0.10 * 0.65 * 350);

  const fmtMoney = (v) => {
    if (v >= 1_000_000) return "$" + (v / 1_000_000).toFixed(v >= 10_000_000 ? 0 : 1) + "M";
    if (v >= 1_000)     return "$" + Math.round(v / 1_000) + "K";
    return "$" + v.toLocaleString("en-US");
  };

  const presets = [["calc.mild", "mild"], ["calc.chaotic", "chaotic"], ["calc.archaic", "archaic"]];

  return (
    <div className="calc">
      <div className="calc-head">
        <div className="ico"><Icon name="calculator" /></div>
        <div>
          <h3>{t("calc.title")}</h3>
          <p>{t("calc.sub")}</p>
        </div>
      </div>

      <div className="calc-g">
        <div className="calc-lr"><label>{t("calc.team")}</label><span className="calc-val">{team}</span></div>
        <input className="slider" type="range" min="1" max="100" value={team} onChange={e => setTeam(+e.target.value)} />
      </div>
      <div className="calc-g">
        <div className="calc-lr"><label>{t("calc.hours")}</label><span className="calc-val">{hours}h</span></div>
        <input className="slider" type="range" min="1" max="40" value={hours} onChange={e => setHours(+e.target.value)} />
      </div>
      <div className="calc-g">
        <div className="calc-lr"><label>{t("calc.rate")}</label><span className="calc-val">${rate}</span></div>
        <input className="slider" type="range" min="25" max="150" value={rate} onChange={e => setRate(+e.target.value)} />
      </div>

      <div className="calc-g">
        <div className="calc-lr"><label>{t("calc.state")}</label></div>
        <div className="presets">
          {presets.map(([k, v]) => (
            <button key={v} className={`preset ${state === v ? "on" : ""}`} onClick={() => setState(v)}>{t(k)}</button>
          ))}
        </div>
      </div>

      <div className="calc-out">
        <div>
          <div className="v">{reclaimed.toLocaleString("en-US")}</div>
          <div className="l">{t("calc.reclaimed")}</div>
        </div>
        <div>
          <div className="v save">
            {fmtMoney(savings)}
            {cappedFlag && <span className="cap-tag">{t("calc.capped")}</span>}
          </div>
          <div className="l">{t("calc.savings")}</div>
        </div>
      </div>

      {showDenial && (
        <div className="calc-bonus">
          <div className="cb-icon"><Icon name="shield-check" /></div>
          <div className="cb-meta">
            <div className="cb-l">{t("calc.denial")}</div>
            <div className="cb-v">{fmtMoney(denial)}</div>
          </div>
        </div>
      )}

      <div className="calc-foot">{t("calc.foot")}</div>
    </div>
  );
}

    { ico: "stethoscope",     en: "Visit",        es: "Consulta",        pain: "Under-documented encounters" },
    { ico: "file-text",       en: "Coding",       es: "Codificación",    pain: "Denials from upcoding" },
    { ico: "credit-card",     en: "Billing",      es: "Facturación",     pain: "Manual claim submissions" },
    { ico: "refresh-cw",      en: "Collections",  es: "Cobranza",        pain: "No follow-up automation" },
  ];
  const lang = useT().lang;
  return (
    <section className="s-darker s-pad lifecycle" id="lifecycle">
      <div className="container">
        <Head
          eyebrow="End-to-End Ownership"
          title="Most consultants fix one step. I fix the whole chain."
          center dark
        />
        <div className="lc-track">
          {stages.map((s, i) => (
            <Reveal key={s.en} delay={`d${(i % 4) + 1}`} className="lc-stage">
              <div className="lc-ico"><Icon name={s.ico} /></div>
              <div className="lc-label">{lang === "es" ? s.es : s.en}</div>
              <div className="lc-pain">{s.pain}</div>
              {i < stages.length - 1 && <div className="lc-arrow"><Icon name="arrow-right" /></div>}
            </Reveal>
          ))}
        </div>
        <Reveal className="lc-cta">
          <p>"Every broken handoff costs you time, revenue, and patients.<br />
          I map the gaps and automate the fix."</p>
          <a href="/audit.html" className="btn btn-primary">Map My Lifecycle Gaps <Icon name="arrow-right" /></a>
        </Reveal>
      </div>
    </section>
  );
}
window.Lifecycle = Lifecycle;

/* ============================================================
   Extras.jsx — Community Mission · Contact · Chat Widget
   ============================================================ */

const CAL_URL  = "/audit.html";
const MAIL_TO  = "mailto:info@jesselopezconsulting.com";
const MAIL_JESSE = "mailto:jesse@jesselopezconsulting.com";
const PHONE_TO = "tel:+17143886080";
const LINKEDIN = "https://linkedin.com/in/jesse-lopez-automation";

/* ---------------- COMMUNITY MISSION ---------------- */

/* ---------------- CONTACT ---------------- */

    { ico: "mail",     lbl: "contact.email",    val: "jesse@jesselopezconsulting.com",  href: MAIL_TO,  cta: "Open mail" },

/* ---------------- LIVE CHAT WIDGET ---------------- */
function ChatWidget() {
  const { t } = useT();
  const [open, setOpen] = React.useState(false);
  const [msg, setMsg] = React.useState("");
  const taRef = React.useRef(null);
  React.useEffect(() => { if (open && taRef.current) taRef.current.focus(); }, [open]);

  // Listen for external "open chat" triggers (CTA button)
  React.useEffect(() => {
    const open = () => setOpen(true);
    window.addEventListener("jlc:openChat", open);
    return () => window.removeEventListener("jlc:openChat", open);
  }, []);

  const send = (e) => {
    e && e.preventDefault();
    const subject = "Question from jesselopezconsulting.com";
    const body = encodeURIComponent(msg || t("chat.placeholder"));
    window.location.href = `${MAIL_TO}?subject=${encodeURIComponent(subject)}&body=${body}`;
  };

  return (
    <>
      <button
        className={`chat-fab ${open ? "open" : ""}`}
        onClick={() => setOpen((o) => !o)}
        aria-label={open ? t("chat.close") : t("chat.open")}
      >
        <span className="fab-ring" />
        <Icon name={open ? "x" : "message-circle"} />
        {!open && <span className="fab-label">{t("chat.open")}</span>}
      </button>

      <div className={`chat-panel ${open ? "open" : ""}`} role="dialog" aria-label={t("chat.title")}>
        <div className="cp-head">
          <div className="cp-av">
            <img src="/Portrait.jpg" alt="Jesse" />
            <span className="cp-on" />
          </div>
          <div className="cp-meta">
            <div className="cp-name">{t("chat.title")}</div>
            <div className="cp-role">{t("chat.role")}</div>
          </div>
          <button className="cp-x" onClick={() => setOpen(false)} aria-label={t("chat.close")}>
            <Icon name="x" />
          </button>
        </div>
        <div className="cp-body">
          <div className="cp-bubble">{t("chat.intro")}</div>
          <form className="cp-form" onSubmit={send}>
            <textarea
              ref={taRef}
              rows={3}
              placeholder={t("chat.placeholder")}
              value={msg}
              onChange={(e) => setMsg(e.target.value)}
            />
            <div className="cp-actions">
              <button type="submit" className="btn btn-primary cp-send">
                <Icon name="send" />{t("chat.send")}
              </button>
              <a href={PHONE_TO} className="cp-call"><Icon name="phone" />{t("chat.call")}</a>
            </div>
          </form>
        </div>
      </div>
    </>
  );
}
window.ChatWidget = ChatWidget;

window.JLC_LINKS = { CAL_URL, MAIL_TO, PHONE_TO, LINKEDIN };

function App() {
  const [lang, setLangState] = React.useState(
    (typeof localStorage !== "undefined" && localStorage.getItem("jlc-lang")) || "en"
  );
  const setLang = (l) => {
    setLangState(l);
    try { localStorage.setItem("jlc-lang", l); } catch (e) {}
    document.documentElement.lang = l;
  };
  const t = React.useCallback(
    (k) => (DICT[lang] && DICT[lang][k]) || DICT.en[k] || k,
    [lang]
  );
  React.useEffect(() => {
    const spot = document.getElementById("spotlight");
    if (!spot) return;
    const onMove = (e) => {
      spot.style.setProperty("--mx", e.clientX + "px");
      spot.style.setProperty("--my", e.clientY + "px");
    };
    window.addEventListener("mousemove", onMove);
    return () => window.removeEventListener("mousemove", onMove);
  }, []);
  return (
    <I18nContext.Provider value={{ lang, setLang, t }}>
      <CustomCursor />
      <Nav />
      <Hero />
      <Work />
      <Services />
      <Lifecycle />
      <Stats />
      <Founder />
      <Community />
      <CTA />
      <Contact />
      <Footer />
      <ChatWidget />
    </I18nContext.Provider>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
